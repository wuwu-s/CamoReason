train_dataset:
  batch_size: 8
  num_workers: 8
  args:
    root: /root/autodl-tmp/MHCD2026
    split: train
    inp_size: 1008
    augment: false
    limit: 0            # 0 = full split; smoke test: 24

val_dataset:
  batch_size: 8
  num_workers: 8
  args:
    root: /root/autodl-tmp/MHCD2026
    split: val
    inp_size: 1008
    augment: false
    limit: 0

test_dataset:
  batch_size: 8
  num_workers: 8
  args:
    root: /root/autodl-tmp/MHCD2026
    split: test
    inp_size: 1008
    augment: false
    limit: 0

model:
  name: camoreason
  args:
    inp_size: 1008
    d_multi: 512
    vit_depth: 32
    vit_stages: 4
    bottleneck: 32
    film_hidden: 256
    ff_ch: 128
    n_fpn_levels: 3
    # loss weights (Eq.31; paper leaves lambdas/tau unspecified -> defaults)
    lambda_iou: 1.0
    lambda_con: 0.1
    lambda_gate: 0.1
    lambda_tv: 0.1
    tau: 0.5
    focal_alpha: 0.25
    focal_gamma: 2.0
    use_hp: true

optimizer:
  name: adamw
  args:
    lr: 4.5e-4
    weight_decay: 0.01

epoch_max: 50
epoch_val: 2
early_stop: 0        # disabled: run to 50ep (matches main model's no-early-stop protocol)
warmup_epochs: 5
accum_steps: 3
lr_min: 1.0e-6
eval_type: cod

sam_checkpoint: /root/SAM3-Adapter/save/_camoreason-mhcd-ahp/model_epoch_last.pth

resume: 16
resume_best_val: 0.9270   # pre-resume best val Sm @ep14; protects best.pth
